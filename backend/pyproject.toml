[project]
name = "mailpilot-api"
version = "0.1.0"
description = "Rules-based Gmail mail merge and follow-up API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "asyncpg>=0.30.0",
  "cryptography>=45.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "google-api-python-client>=2.177.0",
  "google-auth>=2.40.0",
  "google-auth-oauthlib>=1.2.2",
  "itsdangerous>=2.2.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.41",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
